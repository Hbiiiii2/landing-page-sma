name: sma-almadinah

# -------------------------------------------------------------
# Reusable Configurations (Anchors)
# -------------------------------------------------------------
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-common-labels: &default-labels
  com.docker.compose.project: "sma-almadinah"
  app.kubernetes.io/part-of: "sma-almadinah"
  app.kubernetes.io/managed-by: "docker-compose"

services:
  # -----------------------------------------------------------
  # Web Server (Nginx)
  # -----------------------------------------------------------
  sma-almadinah-web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: sma-almadinah-web:latest
    container_name: sma-almadinah-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8020}:80"
    labels:
      <<: *default-labels
      com.docker.compose.service: "sma-almadinah-web"
      dockflare.enable: "true"
      dockflare.hostname: "${DOCKFLARE_HOSTNAME:-smaalmadinah.sch.id}"
      dockflare.service: "http://sma-almadinah-web:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - sma-almadinah-app
    networks:
      smart-network:
        aliases:
          - sma-almadinah-web
          - landingpage_sma
    logging: *default-logging

  # -----------------------------------------------------------
  # Application (PHP 8.4-FPM + Laravel + Filament)
  # -----------------------------------------------------------
  sma-almadinah-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sma-almadinah-app:latest
    container_name: sma-almadinah-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: ${DB_HOST:-sma-almadinah-db}
      DB_PORT: 3306
    labels:
      <<: *default-labels
      com.docker.compose.service: "sma-almadinah-app"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      sma-almadinah-db:
        condition: service_healthy
    networks:
      smart-network:
        aliases:
          - sma-almadinah-app
    logging: *default-logging

  # -----------------------------------------------------------
  # Database (MySQL 8.0)
  # -----------------------------------------------------------
  sma-almadinah-db:
    image: mysql:8.0
    container_name: sma-almadinah-db
    restart: unless-stopped
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sma}
      MYSQL_USER: ${MYSQL_USER:-${DB_USERNAME:-sma_user}}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret123}
    labels:
      <<: *default-labels
      com.docker.compose.service: "sma-almadinah-db"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      smart-network:
        aliases:
          - sma-almadinah-db
    logging: *default-logging

  # -----------------------------------------------------------
  # Background Queue Worker
  # -----------------------------------------------------------
  sma-almadinah-queue:
    image: sma-almadinah-app:latest
    container_name: sma-almadinah-queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: ${DB_HOST:-sma-almadinah-db}
      DB_PORT: 3306
    labels:
      <<: *default-labels
      com.docker.compose.service: "sma-almadinah-queue"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      sma-almadinah-db:
        condition: service_healthy
      sma-almadinah-app:
        condition: service_started
    networks:
      smart-network:
        aliases:
          - sma-almadinah-queue
    logging: *default-logging

  # -----------------------------------------------------------
  # Scheduled Tasks Runner
  # -----------------------------------------------------------
  sma-almadinah-scheduler:
    image: sma-almadinah-app:latest
    container_name: sma-almadinah-scheduler
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: ${DB_HOST:-sma-almadinah-db}
      DB_PORT: 3306
    labels:
      <<: *default-labels
      com.docker.compose.service: "sma-almadinah-scheduler"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      sma-almadinah-db:
        condition: service_healthy
      sma-almadinah-app:
        condition: service_started
    networks:
      smart-network:
        aliases:
          - sma-almadinah-scheduler
    logging: *default-logging

volumes:
  db_data:
    name: sma-almadinah-db-data
    driver: local
  app_storage:
    name: sma-almadinah-app-storage
    driver: local

networks:
  smart-network:
    name: smart-network
    external: true
